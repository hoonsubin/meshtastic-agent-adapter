[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-agent-adapter"
version = "0.1.0"
description = "Meshtastic LoRa mesh network adapter for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hoon Kim", email = "mail@hoon.kim"}
]
requires-python = ">=3.10"
dependencies = [
    "meshtastic>=2.7.0",
    "pycryptodome>=3.20.0",
    "pyserial>=3.5",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "pypubsub>=4.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
meshtastic-bridge = "bridge.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["bridge*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
